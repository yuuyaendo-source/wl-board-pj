# 付箋ボード単体用 Nginx（Let's Encrypt *.internal.wonder-link.com を ~/dev/sv_cert に配置）
# FQDN: https://wlboardsys.internal.wonder-link.com/

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name wlboardsys.internal.wonder-link.com 172.16.1.203;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wlboardsys.internal.wonder-link.com 172.16.1.203;

    ssl_certificate     /home/hisashi/dev/sv_cert/fullchain.pem;
    ssl_certificate_key /home/hisashi/dev/sv_cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    access_log /var/log/nginx/wl-sticky-note_access.log;
    error_log /var/log/nginx/wl-sticky-note_error.log;
    client_max_body_size 10M;

    # Next.jsアプリケーションへのプロキシ
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io専用パス（WebSocket接続用）
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
