server {
    listen 80;
    # ドメイン: wl-sticky-note.local / IP: 172.16.1.81
    server_name wl-sticky-note.local 172.16.1.81;

    # ログ設定
    access_log /var/log/nginx/wl-sticky-note_access.log;
    error_log /var/log/nginx/wl-sticky-note_error.log;

    # クライアントのアップロードサイズ制限
    client_max_body_size 10M;

    # Next.jsアプリケーションへのプロキシ
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket サポート (Socket.io用)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 基本的なプロキシヘッダー
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # キャッシュバイパス
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io専用パス（WebSocket接続用）
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket用のタイムアウト延長
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
