# 付箋ボード単体用 Nginx（Let's Encrypt SSL）
# 証明書: /etc/letsencrypt/live/<ドメイン>/ に certbot で取得した証明書を配置すること

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name wl-sticky-note.local 172.16.1.81;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wl-sticky-note.local 172.16.1.81;

    ssl_certificate     /etc/letsencrypt/live/wl-sticky-note.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wl-sticky-note.local/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    access_log /var/log/nginx/wl-sticky-note_access.log;
    error_log /var/log/nginx/wl-sticky-note_error.log;
    client_max_body_size 10M;

    # Next.jsアプリケーションへのプロキシ
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io専用パス（WebSocket接続用）
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
