<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WONDERLINKO TERMINAL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>

<body>
    <div class="scanlines"></div>
    <div class="glitch-overlay"></div>

    <div class="container">

        <div class="character-area">
            <img src="{{ url_for('static', filename='wonderlinko-2.png') }}" alt="Character" class="character-img">
        </div>

        <div class="ui-area">
            <header class="cyber-header header-glitch">
                <h1>WONDERLINKO SYSTEM TERMINAL</h1>
                <div class="header-subtext">AI VTUBER RECEPTION CONTROL INTERFACE</div>
            </header>

            <div class="status-grid">
                <div class="status-box">
                    <div class="status-label">■ SYSTEM STATUS</div>
                    <div id="current-mode" class="status-value status-stopped">
                        <span class="status-indicator"></span>
                        OFFLINE
                    </div>
                </div>
                <div class="status-box">
                    <div class="status-label">UPTIME</div>
                    <div id="uptime" class="status-value">
                        <span class="mono">00:00:00</span>
                    </div>
                </div>
            </div>

            <div class="control-panel cyber-panel">
                <div class="panel-header">
                    <span class="panel-icon">█</span> CONTROL INTERFACE
                </div>
                <div class="button-grid">
                    <button id="btn-reception" class="cyber-btn btn-reception">
                        <span class="btn-border"></span>
                        <span class="btn-content"><span class="btn-icon">▶</span> RECEPTION MODE</span>
                    </button>
                    <button id="btn-live" class="cyber-btn btn-live" disabled>
                        <span class="btn-border"></span>
                        <span class="btn-content"><span class="btn-icon">●</span> LIVE MODE</span>
                    </button>
                    <button id="btn-stop" class="cyber-btn btn-stop" disabled>
                        <span class="btn-border"></span>
                        <span class="btn-content"><span class="btn-icon">■</span> 停止</span>
                    </button>
                </div>
                <div class="video-mode-selector">
                    <label class="cyber-label">VIDEO MODE:</label>
                    <select id="video-mode" class="cyber-select">
                        <option value="camera">▸ CAMERA</option>
                        <option value="screen">▸ SCREEN SHARE</option>
                    </select>
                </div>
                <div class="voice-selector">
                    <label class="cyber-label">VOICE:</label>
                    <select id="voice-select" class="cyber-select">
                        <option value="Zephyr">▸ ZEPHYR</option>
                        <option value="Aoede">▸ AOEDE</option>
                        <option value="Charon">▸ CHARON</option>
                        <option value="Fenrir">▸ FENRIR</option>
                        <option value="Kore">▸ KORE</option>
                        <option value="Puck">▸ PUCK</option>
                    </select>
                </div>
            </div>

            <div class="log-panel cyber-panel">
                <div class="panel-header">
                    <span class="panel-icon">█</span> SYSTEM LOG
                    <div class="log-controls">
                        <button id="btn-clear-log" class="cyber-btn-small">CLEAR</button>
                        <label class="cyber-checkbox">
                            <input type="checkbox" id="auto-scroll" checked>
                            <span class="checkmark"></span>
                            AUTO-SCROLL
                        </label>
                    </div>
                </div>
                <div id="log-container" class="log-container"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
