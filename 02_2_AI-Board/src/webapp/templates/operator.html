<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>受付オペレーター画面 - AI-Board</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <!-- MediaPipe & Kalidokit -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.4/dist/kalidokit.umd.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #00ffcc;
            margin-bottom: 10px;
        }

        #status {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
            min-width: 400px;
            text-align: center;
        }

        .status-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-label {
            color: #aaa;
        }

        .status-value {
            color: #00ffcc;
            font-weight: bold;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
        }

        .status-indicator.active {
            background-color: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .status-indicator.inactive {
            background-color: #ff0000;
            box-shadow: 0 0 8px #ff0000;
        }

        #controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00ddaa;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        #video-container {
            position: relative;
            width: 640px;
            height: 480px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
        }

        #webcam-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            /* Mirror effect */
        }

        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #remote-audio {
            display: none;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 20px;
            max-width: 600px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <h1>🎧 受付オペレーター画面</h1>

    <div id="status">
        <div class="status-item">
            <span class="status-label">サーバー接続:</span>
            <span class="status-value"><span id="server-status-text">切断中</span><span class="status-indicator inactive" id="server-indicator"></span></span>
        </div>
        <div class="status-item">
            <span class="status-label">音声接続:</span>
            <span class="status-value"><span id="audio-status-text">未接続</span><span class="status-indicator inactive" id="audio-indicator"></span></span>
        </div>
        <div class="status-item">
            <span class="status-label">トラッキング:</span>
            <span class="status-value"><span id="tracking-status-text">停止中</span><span class="status-indicator inactive" id="tracking-indicator"></span></span>
        </div>
    </div>

    <div id="controls">
        <button id="start-btn">受付開始</button>
        <button id="stop-btn" disabled>受付終了</button>
    </div>

    <div id="video-container">
        <video id="webcam-preview" playsinline autoplay></video>
        <canvas id="canvas-overlay"></canvas>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <div class="info-box">
        <strong>使い方:</strong> 「受付開始」をクリックすると、カメラとマイクが起動し、エントランスのアバターを操作できます。<br>
        来客者の声もこちらで聞こえます。
    </div>

    <script type="module">
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const videoElement = document.getElementById('webcam-preview');
        const canvasElement = document.getElementById('canvas-overlay');
        const remoteAudio = document.getElementById('remote-audio');

        let holisticInstance = null;
        let cameraInstance = null;
        let localStream = null;
        let peer = null;
        let isActive = false;

        // Status indicators (text and indicator are separate so updating text doesn't remove the indicator)
        function updateStatus(type, status, active) {
            const statusTextEl = document.getElementById(`${type}-status-text`);
            const indicatorEl = document.getElementById(`${type}-indicator`);
            if (statusTextEl) statusTextEl.textContent = status;
            if (indicatorEl) indicatorEl.className = `status-indicator ${active ? 'active' : 'inactive'}`;
        }

        // 切り分け用: コンソールから socket.emit('tracking_data', {...}) でテスト送信可能
        window._operatorSocket = socket;

        // Socket.IO connection
        socket.on('connect', () => {
            console.log('Connected to server');
            updateStatus('server', '接続中', true);
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            updateStatus('server', '切断中', false);
        });

        // WebRTC Signaling
        socket.on('webrtc-signal', (data) => {
            if (peer && data.from === 'display') {
                peer.signal(data.signal);
            }
        });

        // Start Reception
        startBtn.addEventListener('click', async () => {
            try {
                // Request camera and microphone
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                videoElement.srcObject = localStream;

                // Initialize WebRTC
                peer = new SimplePeer({
                    initiator: true,
                    stream: localStream,
                    trickle: false
                });

                peer.on('signal', (signal) => {
                    socket.emit('webrtc-signal', { from: 'operator', signal });
                });

                peer.on('stream', (stream) => {
                    remoteAudio.srcObject = stream;
                    updateStatus('audio', '接続中', true);
                    console.log('Remote audio stream received');
                });

                peer.on('error', (err) => {
                    console.error('WebRTC error:', err);
                    updateStatus('audio', 'エラー', false);
                });

                // Initialize MediaPipe Holistic (reuse if already created - close() breaks WASM reinit)
                if (!holisticInstance) {
                    holisticInstance = new Holistic({
                        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
                    });
                    holisticInstance.setOptions({
                        modelComplexity: 1,
                        smoothLandmarks: true,
                        minDetectionConfidence: 0.7,
                        minTrackingConfidence: 0.7
                    });
                    holisticInstance.onResults(onHolisticResults);
                }

                // Initialize Camera
                cameraInstance = new Camera(videoElement, {
                    onFrame: async () => {
                        if (holisticInstance) {
                            await holisticInstance.send({ image: videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });

                await cameraInstance.start();

                isActive = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                updateStatus('tracking', '動作中', true);
                console.log('Reception mode started');

            } catch (err) {
                console.error('Failed to start:', err);
                alert('カメラまたはマイクへのアクセスに失敗しました。\nブラウザの設定を確認してください。');
            }
        });

        // Stop Reception (do NOT close holisticInstance - MediaPipe WASM cannot reinit after close())
        stopBtn.addEventListener('click', () => {
            if (cameraInstance) {
                cameraInstance.stop();
                cameraInstance = null;
            }
            // Keep holisticInstance alive for "Start" again; closing it breaks re-initialization

            if (peer) {
                peer.destroy();
                peer = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            videoElement.srcObject = null;
            remoteAudio.srcObject = null;

            isActive = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            updateStatus('tracking', '停止中', false);
            updateStatus('audio', '未接続', false);
            console.log('Reception mode stopped');
        });

        // MediaPipe Results Handler (guard against undefined landmarks so Kalidokit doesn't throw)
        function onHolisticResults(results) {
            if (!isActive) return;

            let riggedPose = null;
            let riggedFace = null;
            let riggedLeftHand = null;
            let riggedRightHand = null;

            if (results.poseLandmarks && results.poseWorldLandmarks) {
                try {
                    const w = videoElement.videoWidth || 640;
                    const h = videoElement.videoHeight || 480;
                    riggedPose = Kalidokit.Pose.solve(results.poseLandmarks, results.poseWorldLandmarks, {
                        runtime: "mediapipe",
                        video: videoElement,
                        imageSize: { width: w, height: h }
                    });
                } catch (e) {
                    console.warn('Kalidokit Pose:', e);
                }
            }
            if (results.faceLandmarks) {
                try {
                    const w = videoElement.videoWidth || 640;
                    const h = videoElement.videoHeight || 480;
                    riggedFace = Kalidokit.Face.solve(results.faceLandmarks, {
                        runtime: "mediapipe",
                        video: videoElement,
                        imageSize: { width: w, height: h }
                    });
                } catch (e) {
                    console.warn('Kalidokit Face:', e);
                }
            }
            if (results.leftHandLandmarks) {
                try {
                    riggedLeftHand = Kalidokit.Hand.solve(results.leftHandLandmarks, "Left");
                } catch (e) {
                    console.warn('Kalidokit LeftHand:', e);
                }
            }
            if (results.rightHandLandmarks) {
                try {
                    riggedRightHand = Kalidokit.Hand.solve(results.rightHandLandmarks, "Right");
                } catch (e) {
                    console.warn('Kalidokit RightHand:', e);
                }
            }

            // Send tracking data via Socket.IO (only if we have something to send)
            if (riggedPose || riggedFace || riggedLeftHand || riggedRightHand) {
                socket.emit('tracking_data', {
                    timestamp: Date.now(),
                    pose: riggedPose,
                    face: riggedFace,
                    leftHand: riggedLeftHand,
                    rightHand: riggedRightHand
                });
            }

            drawLandmarks(results);
        }

        function drawLandmarks(results) {
            const ctx = canvasElement.getContext('2d');
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw pose landmarks (simplified)
            if (results.poseLandmarks) {
                ctx.fillStyle = '#00ffcc';
                results.poseLandmarks.forEach(landmark => {
                    ctx.beginPath();
                    ctx.arc(
                        landmark.x * canvasElement.width,
                        landmark.y * canvasElement.height,
                        3, 0, 2 * Math.PI
                    );
                    ctx.fill();
                });
            }
        }
    </script>
</body>

</html>
