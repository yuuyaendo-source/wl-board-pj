<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AI-Board</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            background-color: #121212;
            /* Dark Mode Background */
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            /* Canvas style */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .sticky-note {
            position: absolute;
            transition: all 0.5s ease;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.4);
            /* Glow effect */
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sticky-note img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 3px;
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Branding / Overlay */
        #branding {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #333;
            font-size: 0.8rem;
            color: #aaa;
            backdrop-filter: blur(5px);
        }

        .online-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 5px #00ff00;
        }

        #ai-chat-box {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
            color: #00ffcc;
            font-size: 1rem;
            display: none;
            /* Hidden by default */
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            animation: slideIn 0.5s ease;
        }

        #ai-chat-box::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 30px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.8) transparent;
            display: block;
            width: 0;
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* VRMアバター表示エリア（画面右下・バストアップ） */
        #avatar-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 280px;
            height: 360px;
            min-width: 280px;
            min-height: 360px;
            z-index: 50;
            pointer-events: none;
            background: transparent;
        }

        #avatar-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #avatar-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Mode Switcher Styles */
        #mode-switcher {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            border-radius: 30px;
            padding: 5px;
            display: flex;
            gap: 5px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .mode-btn.active {
            color: #000;
            background: #00ffcc;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }


        /* Settings Panel Styles */
        #settings-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 220px !important;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            z-index: 9999;
            overflow: visible;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        #settings-panel:not(:hover) {
            opacity: 0.7;
        }

        .settings-header {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px 10px 0 0;
        }

        .settings-content {
            padding: 10px 15px;
            display: none;
        }

        .settings-content.open {
            display: block;
        }

        .setting-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-item label {
            color: #ccc;
        }

        .setting-item input[type="range"] {
            width: 100px;
            accent-color: #00ffcc;
        }

        .setting-item input[type="checkbox"] {
            accent-color: #00ffcc;
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <div id="canvas">
        <!-- Sticky notes will be injected here -->
    </div>

    <div id="ai-chat-box">
        <strong>リン子:</strong> <span id="ai-text">...</span>
    </div>

    <!-- VRMアバター（右下・バストアップ表示） -->
    <div id="avatar-container">
        <div id="avatar-loading">アバター読み込み中...</div>
    </div>

    <div id="branding">
        <div id="unmute-btn"
            style="pointer-events: auto; cursor: pointer; background: #00ff00; color: black; padding: 5px 10px; border-radius: 5px; margin-right: 10px; display: inline-block;">
            🔊 Enable Audio
        </div>
        <span class="online-status"></span> AI-Board System Online | AI: Active
    </div>

    <!-- Mode Switcher -->
    <div id="mode-switcher">
        <button class="mode-btn active" data-mode="ai-board">AI-Board</button>
        <button class="mode-btn" data-mode="reception">Reception</button>
        <button class="mode-btn" data-mode="personal">Personal</button>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel">
        <div class="settings-header">Avatar Settings <span id="toggle-settings">▼</span></div>
        <div class="settings-content" id="settings-content">
            <div class="setting-item">
                <label>Visible</label>
                <input type="checkbox" id="avatar-visible-toggle" checked>
            </div>
            <div class="setting-item">
                <label>Scale</label>
                <input type="range" id="avatar-scale" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>
            <div class="setting-item">
                <label>Pos X</label>
                <input type="range" id="avatar-x" min="-3.0" max="3.0" step="0.1" value="0.0">
            </div>
            <div class="setting-item">
                <label>Pos Y</label>
                <input type="range" id="avatar-y" min="-3.0" max="3.0" step="0.1" value="-1.4">
            </div>
            <div class="setting-item">
                <label>Pos Z</label>
                <input type="range" id="avatar-z" min="-3.0" max="3.0" step="0.1" value="0.0">
            </div>
            <div class="setting-item">
                <label>Rot Y</label>
                <input type="range" id="avatar-rot-y" min="-3.14" max="3.14" step="0.1" value="3.14">
            </div>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
            <div class="setting-item">
                <label>Win Scale</label>
                <input type="range" id="win-scale" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="setting-item">
                <label>Win X</label>
                <input type="range" id="win-x" min="-500" max="500" step="10" value="0">
            </div>
            <div class="setting-item">
                <label>Win Y</label>
                <input type="range" id="win-y" min="-500" max="500" step="10" value="0">
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.min.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        let currentVrm = null;
        // ... (existing vars) ...
        const clock = new THREE.Clock();

        // Window Control State
        let winState = {
            scale: 1.0,
            x: 0,
            y: 0
        };

        function updateWindowTransform() {
            const container = document.getElementById('avatar-container');
            // Assuming default is bottom:0, right:0
            // We use transform to move it relative to that anchor
            container.style.transform = `translate(${winState.x * -1}px, ${winState.y * -1}px) scale(${winState.scale})`;
            container.style.transformOrigin = 'bottom right';
        }

        // ... (rest of imports) ...

        // === Audio Analysis Setup ===
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let isSpeaking = false;

        // Initialize Audio Context
        window.initAudioContext = () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                console.log("AudioContext initialized");
            } else if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        };

        // Connect Audio Element to Analyser
        window.connectAudioToAnalyser = (audioElement) => {
            if (!audioContext) return;
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            isSpeaking = true;

            audioElement.onended = () => {
                isSpeaking = false;
                setEmote('NEUTRAL');
            };
        };

        // === Expression Control ===
        window.setEmote = (tagName) => {
            if (!currentVrm) return;
            const emotion = tagName ? tagName.toUpperCase() : 'NEUTRAL';
            console.log(`Setting Emote: ${emotion}`);

            // Reset all emotions
            currentVrm.expressionManager.setValue('happy', 0);
            currentVrm.expressionManager.setValue('sad', 0);
            currentVrm.expressionManager.setValue('angry', 0);
            currentVrm.expressionManager.setValue('surprised', 0);
            currentVrm.expressionManager.setValue('neutral', 0);

            if (emotion.includes('JOY') || emotion.includes('FUN')) {
                currentVrm.expressionManager.setValue('happy', 1.0);
            } else if (emotion.includes('SORROW') || emotion.includes('SAD')) {
                currentVrm.expressionManager.setValue('sad', 1.0);
            } else if (emotion.includes('ANGRY')) {
                currentVrm.expressionManager.setValue('angry', 1.0);
            } else if (emotion.includes('SURPRISE')) {
                currentVrm.expressionManager.setValue('surprised', 1.0);
            } else {
                currentVrm.expressionManager.setValue('neutral', 1.0);
            }
        };

        (async function () {
            const container = document.getElementById('avatar-container');
            const loadingEl = document.getElementById('avatar-loading');

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(30, 280 / 360, 0.1, 20);
            camera.position.set(0, 1.4, 1.3);
            camera.lookAt(0, 1.4, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(280, 360);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(2, 2, 2);
            scene.add(dirLight);
            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-1, 1, 1);
            scene.add(dirLight2);

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            try {
                const gltf = await loader.loadAsync('/static/avatar.vrm');
                const vrm = gltf.userData.vrm;
                if (vrm && vrm.scene) {
                    currentVrm = vrm; // Store reference
                    // Rotate 180 deg to face the camera (assuming camera is at +Z looking at origin)
                    vrm.scene.rotation.y = Math.PI;
                    scene.add(vrm.scene);

                    // Initial Pose: Arms down (Relaxed from T-pose)
                    const humanoid = vrm.humanoid;
                    if (humanoid) {
                        const lArm = humanoid.getNormalizedBoneNode('leftUpperArm');
                        const rArm = humanoid.getNormalizedBoneNode('rightUpperArm');
                        if (lArm) lArm.rotation.z = Math.PI / 2.3; // ~78 deg down (closer to body)
                        if (rArm) rArm.rotation.z = -Math.PI / 2.3;
                    }

                    if (loadingEl) loadingEl.style.display = 'none';
                    console.log("VRM Loaded");
                } else {
                    if (loadingEl) loadingEl.textContent = 'アバターの形式を読み取れませんでした';
                }
            } catch (err) {
                console.error('VRM load error:', err);
                if (loadingEl) loadingEl.textContent = 'アバターの読み込みに失敗しました';
            }

            // === UI Control Links (Phase 1) ===
            const settingsHeader = document.querySelector('.settings-header');
            const settingsContent = document.getElementById('settings-content');
            const toggleIcon = document.getElementById('toggle-settings');

            if (settingsHeader && settingsContent && toggleIcon) {
                settingsHeader.addEventListener('click', () => {
                    const isOpen = settingsContent.style.display === 'block';
                    settingsContent.style.display = isOpen ? 'none' : 'block';
                    toggleIcon.innerText = isOpen ? '▼' : '▲';
                });
            }

            // Avatar Controls
            const visibleToggle = document.getElementById('avatar-visible-toggle');
            const scaleInput = document.getElementById('avatar-scale');
            const xInput = document.getElementById('avatar-x');
            const yInput = document.getElementById('avatar-y');
            const zInput = document.getElementById('avatar-z');
            const rotYInput = document.getElementById('avatar-rot-y'); // NEW
            const winScaleInput = document.getElementById('win-scale'); // NEW
            const winXInput = document.getElementById('win-x'); // NEW
            const winYInput = document.getElementById('win-y'); // NEW

            visibleToggle.addEventListener('change', (e) => {
                const container = document.getElementById('avatar-container');
                container.style.display = e.target.checked ? 'block' : 'none';
            });

            scaleInput.addEventListener('input', (e) => {
                if (currentVrm && currentVrm.scene) {
                    const s = parseFloat(e.target.value);
                    currentVrm.scene.scale.set(s, s, s);
                }
            });

            xInput.addEventListener('input', (e) => {
                if (currentVrm && currentVrm.scene) {
                    currentVrm.scene.position.x = parseFloat(e.target.value);
                }
            });

            yInput.addEventListener('input', (e) => {
                if (currentVrm && currentVrm.scene) {
                    currentVrm.scene.position.y = parseFloat(e.target.value);
                }
            });

            zInput.addEventListener('input', (e) => {
                if (currentVrm && currentVrm.scene) {
                    currentVrm.scene.position.z = parseFloat(e.target.value);
                }
            });

            // New Listeners
            rotYInput.addEventListener('input', (e) => {
                if (currentVrm && currentVrm.scene) {
                    currentVrm.scene.rotation.y = parseFloat(e.target.value);
                }
            });

            winScaleInput.addEventListener('input', (e) => {
                winState.scale = parseFloat(e.target.value);
                updateWindowTransform();
            });

            winXInput.addEventListener('input', (e) => {
                winState.x = parseFloat(e.target.value);
                updateWindowTransform();
            });

            winYInput.addEventListener('input', (e) => {
                winState.y = parseFloat(e.target.value);
                updateWindowTransform();
            });

            // ... (rest of script) ...


            // Mode Switching
            const modeBtns = document.querySelectorAll('.mode-btn');
            window.currentMode = 'ai-board'; // 'ai-board', 'reception', 'personal'

            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const mode = btn.dataset.mode;
                    window.currentMode = mode;
                    console.log("Mode switched to:", mode);

                    // Mode-specific reset logic
                    if (mode === 'ai-board') {
                        // Ensure auto-animations are active
                        setEmote('NEUTRAL');
                    } else if (mode === 'reception') {
                        // Placeholder for tracking initialization
                        console.log("Reception mode selected (Tracking not implemented yet)");
                    }
                });
            });

            // Animation State
            let blinkTimer = 0;
            let nextBlinkTime = 3;
            let isBlinking = false;
            let blinkDuration = 0.1;

            // Autonomous Motion State
            const lookAtTargetObj = new THREE.Object3D();
            lookAtTargetObj.position.set(0, 1.5, 5); // Default
            scene.add(lookAtTargetObj);

            let lookTimer = 0;
            let nextLookTime = 2.0;

            function animate() {
                requestAnimationFrame(animate);

                const deltaTime = clock.getDelta();
                const elapsedTime = clock.elapsedTime;

                if (currentVrm) {
                    // Setup LookAt Target if not set
                    if (currentVrm.lookAt && currentVrm.lookAt.target !== lookAtTargetObj) {
                        currentVrm.lookAt.target = lookAtTargetObj;
                    }

                    // 1. Autonomous Motion (Only in AI-Board / Personal Mode)
                    if (window.currentMode === 'ai-board' || window.currentMode === 'personal') {
                        const humanoid = currentVrm.humanoid;

                        // A. Breathing & Idle Sway
                        const breath = Math.sin(elapsedTime * 0.8);
                        if (humanoid) {
                            const spine = humanoid.getNormalizedBoneNode('spine');
                            const head = humanoid.getNormalizedBoneNode('head');

                            if (spine) {
                                spine.rotation.x = breath * 0.02;
                                spine.rotation.y = Math.sin(elapsedTime * 0.4) * 0.02;
                            }

                            // B. Speaking Gestures (Hands)
                            if (isSpeaking) {
                                const lArm = humanoid.getNormalizedBoneNode('leftUpperArm');
                                const rArm = humanoid.getNormalizedBoneNode('rightUpperArm');
                                const gestureSpeed = 4.0;
                                const gestureAmp = 0.1;

                                if (lArm) lArm.rotation.z = (Math.PI / 3) + Math.sin(elapsedTime * gestureSpeed) * gestureAmp;
                                if (rArm) rArm.rotation.z = (-Math.PI / 3) - Math.sin(elapsedTime * gestureSpeed + 1) * gestureAmp;
                            }
                        }

                        // C. Random Gaze (Looking around)
                        lookTimer += deltaTime;
                        if (lookTimer > nextLookTime) {
                            lookTimer = 0;
                            nextLookTime = 1.0 + Math.random() * 3.0; // Change gaze every 1-4s

                            // 70% chance to look at camera (approx 0, 1.5, 5), 30% random
                            if (Math.random() < 0.7) {
                                lookAtTargetObj.position.set(0, 1.5, 5);
                            } else {
                                const rx = (Math.random() - 0.5) * 2.0; // -1 to 1
                                const ry = 1.5 + (Math.random() - 0.5) * 1.0;
                                lookAtTargetObj.position.set(rx, ry, 5);
                            }
                        }
                    }

                    // 2. Blinking Logic
                    blinkTimer += deltaTime;
                    if (blinkTimer > nextBlinkTime && !isBlinking) {
                        isBlinking = true;
                        blinkTimer = 0;
                    }

                    if (isBlinking) {
                        const t = blinkTimer / blinkDuration;
                        let blinkVal = 0;
                        if (t < 0.5) blinkVal = t * 2;
                        else blinkVal = (1 - t) * 2;

                        if (t >= 1) {
                            blinkVal = 0;
                            isBlinking = false;
                            nextBlinkTime = 2 + Math.random() * 4;
                            blinkTimer = 0;
                        }
                        currentVrm.expressionManager.setValue('blink', blinkVal);
                    }

                    // 3. Lip Sync logic
                    if (isSpeaking && analyser && dataArray) {
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                        const average = sum / dataArray.length;
                        const volume = Math.min(1.0, (average / 50));
                        currentVrm.expressionManager.setValue('aa', volume);
                    } else if (!isSpeaking) {
                        currentVrm.expressionManager.setValue('aa', 0);
                    }

                    currentVrm.update(deltaTime);
                }

                renderer.render(scene, camera);
            }
            animate();
        })();
    </script>
    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const aiChatBox = document.getElementById('ai-chat-box');
        const aiText = document.getElementById('ai-text');
        const unmuteBtn = document.getElementById('unmute-btn');

        // Unmute logic
        unmuteBtn.addEventListener('click', () => {
            const audio = new Audio();
            audio.play().catch(() => { }); // Try to play silence
            unmuteBtn.style.display = 'none';
            if (window.initAudioContext) window.initAudioContext();
        });

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('new_note', (data) => {
            console.log('New note received:', data);
            createStickyNote(data);
        });

        socket.on('new_mobile_note', (data) => {
            console.log('New mobile note received:', data);
            createStickyNote(data);
        });

        socket.on('new_text_note', (data) => {
            console.log('New text note received:', data);
            createTextStickyNote(data);
        });

        socket.on('ai_comment', (data) => {
            console.log('AI Comment:', data);

            // Extract emotion tag (e.g., [JOY])
            const tagMatch = data.comment.match(/^\[([A-Z]+)\]/);
            const tag = tagMatch ? tagMatch[1] : 'NEUTRAL';

            // Remove tag for display
            const displayText = data.comment.replace(/^\[[A-Z]+\]\s*/, '');

            aiText.innerText = displayText;
            aiChatBox.style.display = 'block';

            // Set Expression
            if (window.setEmote) window.setEmote(tag);

            // Play Audio with Lip Sync
            if (data.audio_url) {
                const audio = new Audio(data.audio_url);
                audio.crossOrigin = "anonymous"; // Important for Web Audio API if CDN used (local is fine usually)

                // Needs to wait for metadata or can connect immediately
                if (window.connectAudioToAnalyser) {
                    window.connectAudioToAnalyser(audio);
                }

                audio.play().catch(e => console.error("Audio playback failed:", e));
            }

            // Hide after 10 seconds
            setTimeout(() => {
                aiChatBox.style.display = 'none';
            }, 10000);
        });

        // Webアプリ側でボード全削除が行われたときに、
        // AI-Board の画面上の付箋とコメントを全てクリアするイベント
        socket.on('clear_all_notes', function () {
            console.log("Clearing all notes from AI-Board UI.");
            // キャンバス上の付箋を全削除
            canvas.innerHTML = '';
            // コメント表示もリセット
            aiText.innerText = '...';
            aiChatBox.style.display = 'none';
        });

        function createStickyNote(data) {
            const noteDiv = document.createElement('div');
            noteDiv.className = 'sticky-note';

            // Random position variation for demo if x/y are static, 
            // or use detected coordinates mapped to screen.
            // For now, we'll try to use the passed coordinates but map them loosely
            // or just scatter them if coordinates aren't calibrated to screen yet.

            // シンプルにするため、まずはランダム配置またはグリッド配置っぽくする
            // 実際の座標マッピングはキャリブレーションが必要なので、
            // 今は画面中央付近にランダムに散らす

            const randomX = Math.random() * (window.innerWidth - 200);
            const randomY = Math.random() * (window.innerHeight - 200);

            noteDiv.style.left = randomX + 'px';
            noteDiv.style.top = randomY + 'px';
            noteDiv.style.width = '200px'; // Width of the sticky note display

            const img = document.createElement('img');
            // Cache busting
            img.src = '/static/captures/' + data.filename + '?t=' + new Date().getTime();

            noteDiv.appendChild(img);
            canvas.appendChild(noteDiv);
        }

        function createTextStickyNote(data) {
            // Check if note already exists
            let noteDiv = document.getElementById('note-' + data.id);

            if (noteDiv) {
                // Update existing note
                const textSpan = noteDiv.querySelector('.note-text');
                if (textSpan) textSpan.innerText = data.text;
                return;
            }

            // Create new note
            noteDiv = document.createElement('div');
            noteDiv.id = 'note-' + data.id;
            noteDiv.className = 'sticky-note';

            const randomX = Math.random() * (window.innerWidth - 200);
            const randomY = Math.random() * (window.innerHeight - 200);

            noteDiv.style.left = randomX + 'px';
            noteDiv.style.top = randomY + 'px';
            noteDiv.style.width = '200px';
            noteDiv.style.minHeight = '100px';
            noteDiv.style.backgroundColor = '#ffeb3b'; // Default yellow
            noteDiv.style.padding = '10px';
            noteDiv.style.color = '#000';
            noteDiv.style.display = 'flex';
            noteDiv.style.flexDirection = 'column';
            noteDiv.style.justifyContent = 'center';
            noteDiv.style.alignItems = 'center';
            noteDiv.style.textAlign = 'center';
            noteDiv.style.fontSize = '1.2rem';
            noteDiv.style.wordBreak = 'break-word';

            const textSpan = document.createElement('span');
            textSpan.className = 'note-text';
            textSpan.innerText = data.text;
            noteDiv.appendChild(textSpan);

            if (data.author) {
                const authorSpan = document.createElement('span');
                authorSpan.innerText = `by ${data.author}`;
                authorSpan.style.fontSize = '0.8rem';
                authorSpan.style.marginTop = '5px';
                authorSpan.style.color = '#555';
                noteDiv.appendChild(authorSpan);
            }

            canvas.appendChild(noteDiv);
        }
    </script>
</body>
