# version は obsolete のため省略（Compose V2）

services:
  backend:
    build: ./backend
    container_name: linko-backend-${COLOR}
    ports:
      - "${PORT_BACKEND}:8000"
    environment:
      # DBは linko-db (docker-compose.db.ymlで定義) に接続
      DATABASE_URL: postgresql+asyncpg://linko_user:linko_password@linko-db:5432/linko_board_system
      # ローカル LLM（Ollama）。未設定時は自動振り分けはスキップ
      OLLAMA_URL: ${OLLAMA_URL:-http://172.16.1.251:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # ※ Gemini は使用しない（コメントアウト）
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
      # GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Google カレンダー連携（パーソナル「今日の予定」）。未設定時は連携無効・ボタンで 503
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      # OAuth 成功後のリダイレクト先。Next basePath が /boards のため /boards を指定（未設定時は /boards）
      OAUTH_SUCCESS_REDIRECT_BASE: ${OAUTH_SUCCESS_REDIRECT_BASE:-/boards}
      POSTIT_BOARD_URL: http://sticky-note:3000
      # Nginx経由のリクエストを信頼
      FORWARDED_ALLOW_IPS: "*"
    networks:
      - linko-net
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://wl-ai-board.internal.wonder-link.co.jp/api/bs}
        NEXT_PUBLIC_BASE_PATH: "/boards"
        NEXT_PUBLIC_LEGACY_BOARD_URL: ${NEXT_PUBLIC_LEGACY_BOARD_URL:-https://wl-ai-board.internal.wonder-link.co.jp}
    container_name: linko-frontend-${COLOR}
    ports:
      - "${PORT_FRONTEND}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://wl-ai-board.internal.wonder-link.co.jp/api/bs}
      NEXT_PUBLIC_LEGACY_BOARD_URL: ${NEXT_PUBLIC_LEGACY_BOARD_URL:-https://wl-ai-board.internal.wonder-link.co.jp}
    networks:
      - linko-net
    restart: always

  sticky-note:
    build:
      context: ../wl-sticky-note/src
      args:
        NEXT_PUBLIC_BASE_PATH: "/board"
    container_name: linko-sticky-note-${COLOR}
    ports:
      - "${PORT_STICKY}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"


      BOARD_SYSTEM_API_URL: https://host.docker.internal/api/bs
      NEXT_PUBLIC_BOARD_SYSTEM_URL: https://wl-ai-board.internal.wonder-link.co.jp/boards
      DATA_DIR: /app/data
    volumes:
      - sticky_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - linko-net
    restart: always

networks:
  linko-net:
    external: true

volumes:
  sticky_data:
