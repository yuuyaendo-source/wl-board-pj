# ステージング環境（本番と同一サーバで別ポート・別DB運用）
# 本番サーバの Nginx の http {} 内で include する。
# 例: include /etc/nginx/conf.d/staging.conf;
# FQDN: staging.wl-ai-board.internal.wonder-link.com（本番サーバ IP 172.16.1.84 に名前解決させること）

upstream staging_frontend { server 127.0.0.1:3030; }
upstream staging_backend  { server 127.0.0.1:8030; }
upstream staging_sticky   { server 127.0.0.1:3031; }

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name staging.wl-ai-board.internal.wonder-link.com;
    return 301 https://$host$request_uri;
}

# HTTPS（本番と同じ Let's Encrypt 証明書を使用）
server {
    listen 443 ssl;
    server_name staging.wl-ai-board.internal.wonder-link.com;

    ssl_certificate     /home/devuser01/sv_cert/fullchain.pem;
    ssl_certificate_key /home/devuser01/sv_cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    location /socket.io/ {
        proxy_pass http://staging_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /board/ {
        proxy_pass http://staging_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/boards/ {
        proxy_pass http://staging_sticky/api/boards/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/sticky_notes {
        proxy_pass http://staging_sticky/api/sticky_notes;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        proxy_pass http://staging_sticky/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bs/ {
        rewrite ^/api/bs/(.*)$ /$1 break;
        proxy_pass http://staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /boards/ {
        proxy_pass http://staging_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 https://$host/boards/taskboard;
    }

    location / {
        return 302 https://$host/boards/taskboard;
    }
}
