# ステージング環境（本番と同一サーバで別ポート運用）
# 本番サーバの Nginx の http {} 内で include する。
# 例: include /etc/nginx/conf.d/staging.conf;
# 事前に deploy-staging.sh でコンテナを起動し、staging.wl-sticky-note.local を本番サーバ IP に解決させること。

upstream staging_frontend { server 127.0.0.1:3030; }
upstream staging_backend  { server 127.0.0.1:8030; }
upstream staging_sticky   { server 127.0.0.1:3031; }

server {
    listen 80;
    server_name staging.wl-sticky-note.local;

    location /socket.io/ {
        proxy_pass http://staging_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /board/ {
        proxy_pass http://staging_sticky;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    location /api/boards/ {
        proxy_pass http://staging_sticky/api/boards/;
        proxy_set_header Host $host;
    }

    location /api/sticky_notes {
        proxy_pass http://staging_sticky/api/sticky_notes;
        proxy_set_header Host $host;
    }

    location = /api/health {
        proxy_pass http://staging_sticky/api/health;
        proxy_set_header Host $host;
    }

    location /api/bs/ {
        rewrite ^/api/bs/(.*)$ /$1 break;
        proxy_pass http://staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /boards/ {
        proxy_pass http://staging_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        return 302 /boards/taskboard;
    }

    location / {
        return 302 /boards/taskboard;
    }
}
